# Release rebuild trigger 2026-10-03
name: Build Play Store AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/playstore-aab.yml'
      - 'playstore-preflight.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'play.html'
      - 'index.html'
      - 'app-v10.js'
      - 'step21-bluetooth-runtime.js'
      - 'native/**'
      - 'privacy.html'
      - 'step16-question-integrity.js'
      - 'step17-study-runtime.js'
      - 'step18-progress-unified.js'
      - 'step19-specialty-stats.js'
      - 'step20-clinical-cases.js'
      - 'step21-bluetooth-runtime.js'
      - 'tests/**'

jobs:
  build-playstore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Play Console preflight
        run: node playstore-preflight.js

      - name: Validate web sources
        shell: bash
        run: |
          node --check app-v10.js
          node --check android-navigation.js
          node --check teacher.js
          node --check exam.js
          node --check legacy-difficulty-audit.js
          node --check legacy-case-grading-audit.js
          node --check step16-question-integrity.js
          node --check step17-study-runtime.js
          node --check step18-progress-unified.js
          node --check step19-specialty-stats.js
          node --check step20-clinical-cases.js
          node --check step21-bluetooth-runtime.js

      - name: Install Capacitor 8 for Android 16
        run: |
          npm install --package-lock=false --no-save --legacy-peer-deps \
            @capacitor/core@8.5.2 \
            @capacitor/android@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor/app@8.1.1

      - name: Prepare production web bundle
        shell: bash
        run: |
          rm -rf www android
          mkdir -p www
          cp index.html play.html privacy.html site.css teacher.html teacher.css teacher.js exam.html exam.css exam.js \
             legacy-difficulty-audit.js legacy-case-grading-audit.js manifest.webmanifest sw.js \
             styles-v10.css ui-polish.css character-art.css i18n.js learning-tools.js accessibility.js app-v10.js android-navigation.js step16-question-integrity.js step17-study-runtime.js step18-progress-unified.js step19-specialty-stats.js step20-clinical-cases.js step21-bluetooth-runtime.js step23-recovery-runtime.js www/
          cp questions*.js cases*.js nomenclatura-etimologia-questions.js fundamentos-oclusion.js fundamentos-casos.js steiner-questions.js steiner-cases.js \
             fisiologia-funcion-questions.js fisiologia-funcion-cases.js crecimiento-desarrollo-questions.js \
             crecimiento-desarrollo-cases.js habitos-parafunciones-*.js www/
          cp -r brand www/

      - name: Set permanent Play Store package
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('capacitor.config.json')
          d=json.loads(p.read_text())
          d['appId']='com.uam.cientodentistas'
          d['appName']='El Camino Dental'
          d['webDir']='www'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2))
          PY

      - name: Create Android project
        run: npx cap add android

      - name: Sync native plugins and web assets
        run: npx cap sync android

      - name: Install native Bluetooth bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/uam/cientodentistas
          cp native/DentalBluetoothPlugin.java android/app/src/main/java/com/uam/cientodentistas/DentalBluetoothPlugin.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/uam/cientodentistas/MainActivity.java')
          s=p.read_text()
          if 'DentalBluetoothPlugin' not in s:
              s=s.replace('import com.getcapacitor.BridgeActivity;', 'import com.getcapacitor.BridgeActivity;\nimport com.uam.cientodentistas.DentalBluetoothPlugin;')
              s=s.replace('public class MainActivity extends BridgeActivity {', 'public class MainActivity extends BridgeActivity {\n  @Override public void onCreate(android.os.Bundle savedInstanceState) { super.onCreate(savedInstanceState); registerPlugin(DentalBluetoothPlugin.class); }')
          p.write_text(s)
          m=Path('android/app/src/main/AndroidManifest.xml')
          ms=m.read_text()
          perms='''<uses-permission android:name="android.permission.BLUETOOTH" />\n<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\n<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n<uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />'''
          if 'android.permission.BLUETOOTH_SCAN' not in ms: ms=ms.replace('    <application', '    '+perms.replace('\n','\n    ')+'\n    <application', 1)
          m.write_text(ms)
          PY

      - name: Configure Android 16, release identity and branding
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp brand/ic_launcher_custom.xml android/app/src/main/res/drawable/ic_launcher_custom.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          x=manifest.read_text()
          x=x.replace('android:exported="true"','android:exported="true" android:keepScreenOn="true"',1)
          x=x.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/ic_launcher_custom"')
          x=x.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/ic_launcher_custom"')
          manifest.write_text(x)

          strings=Path('android/app/src/main/res/values/strings.xml')
          x=strings.read_text()
          x=re.sub(r'<string name="app_name">.*?</string>','<string name="app_name">El Camino Dental</string>',x)
          x=re.sub(r'<string name="title_activity_main">.*?</string>','<string name="title_activity_main">El Camino Dental</string>',x)
          strings.write_text(x)

          gradle=Path('android/app/build.gradle')
          g=gradle.read_text()
          g=re.sub(r'versionCode\s+\d+','versionCode 37',g)
          g=re.sub(r'versionName\s+"[^"]+"','versionName "3.7.0"',g)
          gradle.write_text(g)

          variables=Path('android/variables.gradle')
          if variables.exists():
              v=variables.read_text()
              v=re.sub(r'compileSdkVersion\s*=\s*\d+','compileSdkVersion = 36',v)
              v=re.sub(r'targetSdkVersion\s*=\s*\d+','targetSdkVersion = 36',v)
              variables.write_text(v)
          PY
          grep -nE 'compileSdkVersion|targetSdkVersion|minSdkVersion' android/variables.gradle || true
          grep -nE 'applicationId|versionCode|versionName' android/app/build.gradle

      - name: Build unsigned release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Collect Play Store bundle
        shell: bash
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab ElCaminoDental-3.7.0-playstore-unsigned.aab
          cat > playstore-build-info.txt <<'EOF'
          App: El Camino Dental
          Package: com.uam.cientodentistas
          Version name: 3.7.0
          Version code: 37
          Target SDK: 36 (Android 16)
          Build type: release AAB, unsigned; requires Play App Signing/upload-key configuration before upload
          Capacitor Android/Core/CLI: 8.5.2
          Capacitor App plugin: 8.1.1
          EOF
          sha256sum ElCaminoDental-3.7.0-playstore-unsigned.aab >> playstore-build-info.txt

      - name: Upload Play Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElCaminoDental-PlayStore-3.7.0
          path: |
            ElCaminoDental-3.7.0-playstore-unsigned.aab
            playstore-build-info.txt
          if-no-files-found: error
